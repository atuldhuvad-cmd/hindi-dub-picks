<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hindi Dub Picks</title>
<meta name="description" content="Top-rated crime thriller, suspense and comedy titles in Hindi dub, with watch links.">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>Hindi Dub <span>Picks</span></h1>
  <p id="meta">Loading…</p>
  <input id="q" type="search" placeholder="Search title, origin…" aria-label="Search">
  <div class="controls">
    <button id="favorites" type="button" aria-pressed="false">Favorites only</button>
    <button id="watched" type="button" aria-pressed="false">Show watched (0)</button>
    <label>Sort
      <select id="sort">
        <option value="newest">Newest</option>
        <option value="rating">Highest rated</option>
        <option value="title">Title A–Z</option>
      </select>
    </label>
  </div>
  <div class="chips" id="regions" aria-label="Region"></div>
  <div class="chips" id="genres" aria-label="Genre"></div>
  <div class="chips" id="platforms" aria-label="Platform"></div>
</header>
<main id="grid" aria-live="polite"></main>
<footer>Data: IMDb ratings via OMDb. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script src="js/app.js"></script>
</body>
</html>
